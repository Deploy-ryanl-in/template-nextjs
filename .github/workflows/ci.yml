name: CI and deployment
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.21.0', cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
  release:
    needs: test
    if: github.event_name == 'push' && !github.event.repository.is_template
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    uses: Deploy-ryanl-in/personal-paas/.github/workflows/release.yml@5bd7960c2f4cc1fa0a8b5cc23a4e264a13ba686d
    with:
      deployment-url: https://deploy.ryanl.in
      domain: ryanl.in
      platform-repository: Deploy-ryanl-in/personal-paas
      platform-sha: 5bd7960c2f4cc1fa0a8b5cc23a4e264a13ba686d
    secrets:
      PAAS_SECRETS: ${{ secrets.PAAS_SECRETS }}
