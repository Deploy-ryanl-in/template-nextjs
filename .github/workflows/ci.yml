name: CI and deployment
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  invalidate_cache:
    if: github.event_name == 'push' && !github.event.repository.is_template
    permissions: {contents: read, actions: read, id-token: write}
    uses: Deploy-ryanl-in/personal-paas/.github/workflows/operate.yml@07e98808a2a2743444d53188692686421ac3c1f3
    with:
      deployment-url: https://deploy.ryanl.in
      action: clear-route-cache
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.21.0', cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
  release:
    needs: [test, invalidate_cache]
    if: github.event_name == 'push' && !github.event.repository.is_template
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    uses: Deploy-ryanl-in/personal-paas/.github/workflows/release.yml@07e98808a2a2743444d53188692686421ac3c1f3
    with:
      deployment-url: https://deploy.ryanl.in
      domain: ryanl.in
      platform-repository: Deploy-ryanl-in/personal-paas
      platform-sha: 07e98808a2a2743444d53188692686421ac3c1f3
    secrets:
      PAAS_SECRETS: ${{ secrets.PAAS_SECRETS }}
